<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 Rádio Bagres 🐟 - YouTube (Sincronizada)</title>
    <style>
        /* ======== ESTILO GERAL ======== */
        body {
          background: linear-gradient(135deg, #1a1a1a, #222, #111);
          color: #f0f0f0;
          font-family: "Poppins", Arial, sans-serif;

          min-height: 100vh;
          margin: 0;
          padding: 20px;
          overflow-y: auto;
          text-align: center;
        }

        #app-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            margin: 25px auto;
            width: fit-content
            flex-wrap: wrap;
        }

        #radio-and-playlist-wrapper {
            display: flex;
            flex-direction: column;
            gap: 25px;
            justify-content: flex-start;
            align-items: center;
        }

        h2 {
          font-size: 2em;
          margin-bottom: 15px;
          background: linear-gradient(90deg, #3498db, #9b59b6);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: pulse 3s infinite alternate;
          text-align: center;
        }

        @keyframes pulse {
          from { opacity: 0.8; }
          to { opacity: 1; }
        }

        /* ======== PLAYER INVISÍVEL ======== */
        #player {
          width: 1px;
          height: 1px;
          position: absolute;
          left: -9999px;
          top: -9999px;
          overflow: hidden;
        }

        #radio-title-main {
          font-size: 2em;
          margin-bottom: 15px;
          animation: pulse 3s infinite alternate;
          text-align: center;
          /* Cor base */
          color: #f0f0f0;
        }

        /* Aplica o gradiente APENAS ao texto principal */
        #radio-title-main .title-text-gradient {
          background: linear-gradient(90deg, #3498db, #9b59b6);
          /* Propriedades que tornam o texto transparente e mostram o gradiente */
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          color: transparent; /* Fallback para navegadores sem -webkit- */
          display: inline;
        }

        /* * CORREÇÃO PARA O EMOJI:
         * Remove as propriedades de texto transparente e garante que a cor seja herdada
         * ou definida para aparecer corretamente.
         */
        #radio-title-main .emoji-icon {
          /* Remove a transparência forçada que esconde o emoji */
          -webkit-text-fill-color: initial;
          color: inherit;

          /* Remove o clip de background que o emoji pode herdar */
          -webkit-background-clip: initial;
          background-clip: initial;
        }

        #main-content-wrapper {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            margin: 0 auto 25px auto;
            flex-wrap: wrap;
            max-width: 900px;
        }

        /* ======== CARD PRINCIPAL ======== */
        .radio-container {
          background: rgba(0, 0, 0, 0.5);
          backdrop-filter: blur(10px);
          border-radius: 20px;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
          padding: 30px 40px;
          text-align: center;
          width: 350px;
          max-width: 100%;
          transition: transform 0.3s ease;
          height: fit-content;
          box-sizing: border-box;
        }

        .radio-container:hover {
          transform: scale(1.02);
        }

        /* ======== INFO ======== */
        #current-info {
          margin-top: 15px;
          font-size: 1.1em;
          font-weight: 500;
          color: #ccc;
          word-break: break-word;
        }

        /* ======== ESTILO CONTADOR DE OUVINTES ======== */
        .listener-info-container {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: 500;
            color: #3498db; /* Cor azul de destaque */
            text-align: center;
        }

        #listener-count {
            font-weight: 700; /* Deixa o número em negrito */
            color: #2ecc71; /* Cor verde para destaque */
            margin-left: 5px;
        }

        /* ======== BOTÕES ======== */
        .controls {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 15px;
          margin-top: 20px;
        }

        button {
          padding: 10px 20px;
          font-size: 1em;
          font-weight: 600;
          border: none;
          border-radius: 10px;
          cursor: pointer;
          color: #fff;
          transition: all 0.3s ease;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        #audioToggle {
          background: #3498db;
        }

        #audioToggle:hover {
          background: #2980b9;
          transform: scale(1.05);
        }

        #skipButton {
          background: #e74c3c;
        }

        #skipButton:hover {
          background: #c0392b;
          transform: scale(1.05);
        }

        /* ======== FORM DE ADIÇÃO ======== */
        form {
          margin-top: 30px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        label {
          font-size: 0.9em;
          color: #aaa;
        }

        input[type="text"] {
          width: 100%;
          max-width: 260px;
          padding: 10px;
          border-radius: 8px;
          border: 1px solid #555;
          background: #222;
          color: #eee;
          font-size: 0.9em;
          outline: none;
          transition: border 0.3s ease;
        }

        input[type="text"]:focus {
          border-color: #3498db;
        }

        form button {
          background: #27ae60;
        }

        form button:hover {
          background: #219150;
        }

        /* ======== FUNDO ANIMADO ======== */
        .background-anim {
          position: fixed;
          width: 200%;
          height: 200%;
          top: -50%;
          left: -50%;
          z-index: -1;
          background: radial-gradient(circle at center, #3498db33, #000000);
          animation: rotateBg 20s linear infinite;
        }

        @keyframes rotateBg {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        /* ======== RESPONSIVIDADE ======== */
        @media (max-width: 600px) {
          h2 {
            font-size: 1.6em;
          }

          .radio-container {
            width: 95%;
            padding: 25px 20px;
          }

          button {
            width: 100%;
            max-width: 200px;
          }

          #refreshButton {
              width: 100%;
              max-width: none;
          }

          input[type="text"] {
            width: 90%;
          }

          #current-info {
            font-size: 1em;
          }
        }

        @media (min-width: 1200px) {
          h2 {
            font-size: 2.4em;
          }

          .radio-container {
            width: 420px;
          }
        }

        .chat-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            padding: 20px 30px 100px 30px;
            margin-top: 0;
            width: 350px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        @media (min-width: 1200px) {
            .radio-container,
            .chat-container,
            .playlist-container {
                width: 420px;
            }

            /* Título maior */
            h2 {
                font-size: 2.4em;
            }

            #app-wrapper {
                max-width: 900px;
            }
        }

        @media (max-width: 800px) {
            #app-wrapper {
                flex-direction: column;
                gap: 20px;
                width: 100%;
                margin: 20px auto;
                margin: 20px auto;
                align-items: center;
            }

            #radio-and-playlist-wrapper {
                gap: 20px;
                width: 100%;
            }

            .radio-container,
            .chat-container,
            .playlist-container {
                width: 100%;
                padding: 25px 20px;
                box-sizing: border-box;
            }

            h2 {
              font-size: 1.6em; /* Vindo da regra antiga de 600px */
            }

            #current-info {
              font-size: 1em; /* Vindo da regra antiga de 600px */
            }

            input[type="text"] {
              width: 100%;
              max-width: none;
            }

            #chat-form {
                display: flex; /* Adicionado display: flex, se não estiver no CSS base */
                flex-direction: column;
                gap: 10px; /* Adiciona espaçamento entre o bloco de inputs e o botão */
                align-items: stretch;
            }
            #chat-inputs-wrapper {
                width: 100%;
                flex-direction: column;
                gap: 5px;
            }
            #chat-sender,
            #chat-input {
                width: 100% !important; /* Inputs dentro do wrapper */
                box-sizing: border-box;
                height: auto;
            }

            #chat-form button {
                /* O botão fica sozinho numa linha abaixo dos inputs */
                width: fit-content !important; /* Ocupa apenas o espaço necessário */
                height: auto !important;
                max-width: none !important;
                box-sizing: border-box;
                /* Alinha o botão à direita */
                align-self: flex-end;
                padding: 10px 20px; /* Garante que o botão tenha um tamanho visível */
            }

            .controls button,
            #refreshButton {
                width: 100%;
                max-width: none;
            }
        }

        /* ======== CHAT ESTILOS ======== */
        .chat-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            padding: 20px 30px 21px 30px;
            margin-top: 0px;
            width: 350px;
            max-width: 100%;
        }
        .chat-container h3 {
            font-size: 1.4em;
            color: #f39c12; /* Cor de destaque para o chat */
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        #chat-messages {
            list-style: none;
            padding: 0;
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            background: #1e1e1e;
            margin-bottom: 0 !important;
            text-align: left;
        }
        #chat-messages li {
            padding: 5px 0;
            font-size: 0.9em;
            color: #eee;
            word-break: break-word;
        }
        #chat-form {
            display: flex;
            flex-direction: row;
            gap: 5px;
            margin-top: 5px;
            width: 100%;
        }
        #chat-input, #chat-sender {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #222;
            color: #eee;
            font-size: 0.9em;
            width: 100%;
            flex-grow: 1;
            box-sizing: border-box;
        }
        #chat-sender {
            flex-basis: 30%;
        }
        #chat-input {
            flex-basis: 70%;
        }
        #chat-form button {
            background: #f39c12;
            padding: 8px 10px;
            font-size: 0.9em;
            align-self: flex-start;
            width: auto;
            height: 100%;
            flex-shrink: 0;
        }
        #chat-form button:hover {
            background: #e67e22;
        }
        #chat-inputs-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        /* RESPONSIVIDADE CHAT */
        @media (max-width: 600px) {
            #chat-form {
                flex-wrap: wrap;
                display: flex;
                flex-direction: column;
                gap: 10px
            }
            #chat-sender, #chat-input {
                width: 100% !important;
                box-sizing: border-box;
            }
            #chat-form button {
                width: fit-content;
                align-self: flex-end;
                padding: 10px 20px;
                max-width: none !important;
            }
        }

        /* ======== ESTILO PLAYLIST ======== */
        .playlist-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            padding: 20px 30px;
            margin-top: 0px;
            width: 350px;
            max-width: 90%;
        }

        .playlist-container h3 {
            font-size: 1.4em;
            color: #3498db;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        #playlist-ul {
            list-style: none;
            padding: 0;
            max-height: 250px; /* Limita a altura para que a lista tenha scroll */
            overflow-y: auto;
        }

        /* Estilos para a barra de rolagem (Scrollbar) */
        #playlist-ul::-webkit-scrollbar {
            width: 6px;
        }
        #playlist-ul::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 3px;
        }
        #playlist-ul::-webkit-scrollbar-track {
            background: #111;
            border-radius: 3px;
        }


        #playlist-ul li {
            padding: 8px 0;
            border-bottom: 1px dashed #333;
            font-size: 0.9em;
            color: #eee;
            word-break: break-word;
        }

        #playlist-ul li:last-child {
            border-bottom: none;
        }

        #refreshButton {
            background: #9b59b6;
            margin-top: 15px;
            width: 100%;
        }

        #refreshButton:hover {
            background: #8e44ad;
        }
    </style>

</head>
<body>
    <span>mudando</span>
<div class="background-anim"></div>

<div id="radio-status-message" style="font-size: 1.2em; font-weight: bold; margin-bottom: 5px;"> </div>

<div id="app-wrapper">

    <div class="chat-container">
        <h3>Chat</h3>
        <ul id="chat-messages">
            <li>Conectando ao chat...</li>
        </ul>
        <form id="chat-form" onsubmit="event.preventDefault(); sendMessage();">
            <div id="chat-inputs-wrapper"> <input id="chat-sender" type="text" placeholder="Seu nome" required />
                <input id="chat-input" type="text" placeholder="Digite sua mensagem..." required />
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <div id="radio-and-playlist-wrapper">
        <div class="radio-container">
            <h2 id="radio-title-main">
                <span class="title-text-gradient">Rádio Bagres</span>
                <span class="emoji-icon">🐟</span>
            </h2>

            <div id="player"></div>
            <div id="current-info">Carregando rádio...</div>
            <div class="listener-info-container">
                Ouvintes Ativos: <span id="listener-count">0</span>
            </div>

            <div class="controls">
                <button id="audioToggle" onclick="toggleAudio()">Ativar Áudio</button>
                <button id="skipButton" onclick="skipSong()">⏭ Pular Música</button>
            </div>

            <form id="youtube-form" onsubmit="event.preventDefault(); addMusic(document.getElementById('videoId').value);">
                <label for="videoId">YouTube URL ou Video ID:</label>
                <input id="videoId" name="videoId" type="text" placeholder="ex: https://youtu.be/abc123" required />
                <button type="submit">Adicionar por URL</button>
            </form>
            <hr style="width: 80%; border: 1px dashed #555; margin: 20px auto;">

            <form id="search-form" onsubmit="event.preventDefault(); searchAndAddMusic();">
                <label for="searchQuery">Buscar por Nome:</label>
                <input id="searchQuery" name="searchQuery" type="text" placeholder="ex: Icaro e Gilmar" required />
                <button type="submit">Buscar & Adicionar</button>
            </form>

            <div id="search-result-message" style="margin-top: 10px; font-size: 0.9em; color: #ffeb3b;"></div>
        </div>

        <div class="playlist-container">
            <h3>Fila de músicas</h3>
            <ul id="playlist-ul">
                <li>Carregando lista...</li>
            </ul>
            <button id="refreshButton" onclick="renderPlaylist()">Atualizar Lista</button>
        </div>
    </div>

</div>

<script>
    var player;
    var currentVideoId = '';
    var isMuted = true;

    // Carrega a API do YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '270',
            width: '480',
            videoId: '',
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'modestbranding': 1,
                'rel': 0,
                'mute': 1,
                'disablekb': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.playVideo();
        connectToMetadataStream();
        renderPlaylist();
        connectChat();
        syncChatHeight();
        setTimeout(syncChatHeight, 500);
        setTimeout(syncChatHeight, 1000);
    }

    window.addEventListener('resize', syncChatHeight);

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.BUFFERING) {
            player.playVideo();
        }
        if (event.data === YT.PlayerState.ENDED) {
            skipSong();
        }
    }

    function toggleAudio() {
        const audioButton = document.getElementById('audioToggle');
        if (isMuted) {
            player.unMute();
            isMuted = false;
            audioButton.innerText = 'Desativar Áudio';
        } else {
            player.mute();
            isMuted = true;
            audioButton.innerText = 'Ativar Áudio';
        }
    }

    function connectToMetadataStream() {
        const eventSource = new EventSource('/radio/metadata');
        const statusElement = document.getElementById('radio-status-message');

        eventSource.addEventListener("sync", function(event) {
            try {
                const data = JSON.parse(event.data);
                const newVideoId = data.videoId;
                const statusMessage = data.statusMessage;
                const newTitle = data.title;

                statusElement.innerText = statusMessage || "Sincronizando...";

                if (newVideoId === "RADIO_STOPPED_ID") {
                    if (currentVideoId !== newVideoId) {
                        if (player.getPlayerState() === YT.PlayerState.PLAYING || player.getPlayerState() === YT.PlayerState.BUFFERING) {
                            player.stopVideo();
                        }
                        document.getElementById('current-info').innerText = newTitle;
                        currentVideoId = newVideoId;
                    }
                    return;
                }

                const startTimeMs = data.startTime;
                const elapsedTimeMs = Date.now() - startTimeMs;
                let seekTimeSeconds = elapsedTimeMs / 1000 + 0.20;
                if (seekTimeSeconds < 0) seekTimeSeconds = 0;

                if (newVideoId !== currentVideoId) {
                    currentVideoId = newVideoId;
                    document.getElementById('current-info').innerText = `${newTitle}`;
                    player.loadVideoById(newVideoId, seekTimeSeconds);
                    player.playVideo();
                }
            } catch (e) {
                console.error("Erro ao processar dados de sincronização:", e);
            }
        });

        eventSource.addEventListener("listener_count", function(event) {
            document.getElementById('listener-count').innerText = event.data;
        });

        eventSource.addEventListener("playlist_update", function(event) {
            console.log("Evento de atualização de playlist recebido. Atualizando lista...");
            renderPlaylist();
        });

        eventSource.onerror = function(err) {
            console.error("SSE falhou. Tentando reconectar...", err);
            eventSource.close();
            setTimeout(connectToMetadataStream, 5000);
        };
    }

    function updatePlaylistDisplay() {
        fetch('/radio/playlist') // Endpoint que você criou no Java
            .then(response => response.json())
            .then(videoList => {
                const listElement = document.getElementById('playlist-list');
                listElement.innerHTML = '';

                if (videoList.length === 0) {
                    listElement.innerHTML = '<li>Nenhuma música na fila.</li>';
                    return;
                }

                videoList.forEach(video => {
                    const listItem = document.createElement('li');
                    listItem.textContent = video.title;
                    listElement.appendChild(listItem);
                });
            })
            .catch(error => console.error('Erro ao buscar playlist:', error));
    }

    async function skipSong() {
        document.getElementById('current-info').innerText = '⏭ Pulando música...';
        try {
            const response = await fetch('/radio/skip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'videoId=' + encodeURIComponent(currentVideoId)
            });
            if (response.ok) {
                const message = await response.text();
                console.log("Skip bem-sucedido:", message);
            } else {
                alert("Falha ao pular música.");
            }
        } catch (error) {
            alert("Erro de rede.");
        }
        renderPlaylist();
    }
    async function getPlaylist() {
            const response = await fetch('/radio-lista');
            console.log(await response.json());
    }

    async function updateListenerCount() {
    try {
        const response = await fetch('/radio/listeners');
        const count = await response.json();

        document.getElementById('listener-count').innerText = count;
    } catch (error) {
        console.error("Erro ao buscar contagem de ouvintes:", error);
        document.getElementById('listener-count').innerText = "Erro";
    }
}

    async function addMusic(urlMusic) {
        const videoId = extractYouTubeId(urlMusic);
        fetch('/radio/add-youtube', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'videoId=' + encodeURIComponent(videoId)
        });
        document.getElementById('videoId').value = '';
        renderPlaylist();
    }

    async function searchAndAddMusic() {
        const query = document.getElementById('searchQuery').value.trim();
        const resultMessageElement = document.getElementById('search-result-message');

        if (!query) return;

        resultMessageElement.innerText = `Buscando por "${query}"...`;

        try {
            const addResponse = await fetch('/radio/search-add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'query=' + encodeURIComponent(query)
            });

            const addMessage = await addResponse.text();
            document.getElementById('radio-status-message').innerText = addMessage;

            if (addResponse.ok) {
                resultMessageElement.innerText = `Música adicionada`;
                document.getElementById('searchQuery').value = '';
            } else {
                resultMessageElement.innerText = `Erro: ${message}`;
            }
            renderPlaylist();
        } catch (error) {
            console.error("Erro na busca com yt-dlp:", error);
            resultMessageElement.innerText = 'Erro de rede ou falha na execução do yt-dlp.';
        }
    }

    async function renderPlaylist() {
    const listElement = document.getElementById('playlist-ul');
    listElement.innerHTML = '<li>Atualizando...</li>'; // Feedback de carregamento

    try {
        const response = await fetch('/radio-lista');

        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }

        const playlistIds = await response.json();

        listElement.innerHTML = '';

        if (playlistIds && playlistIds.length > 0) {
            playlistIds.forEach((video, index) => {
                const li = document.createElement('li');

                li.innerText = `${index + 1}. ${video.title}`;

                listElement.appendChild(li);
            });
        } else {
            listElement.innerHTML = '<li>A fila está vazia.</li>';
        }
    } catch (error) {
        console.error("Erro ao carregar a playlist:", error);
        listElement.innerHTML = '<li>Erro ao carregar a lista.</li>';
    }
}

    function extractYouTubeId(input) {
        const match = input.match(/[?&]v=([^&]+)/);
        if (match) return match[1];
        const shortMatch = input.match(/youtu\.be\/([^?&]+)/);
        if (shortMatch) return shortMatch[1];
        return input;
    }

    var stompClient = null;
    const chatMessagesElement = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSender = document.getElementById('chat-sender');

    function connectChat() {
        const socket = new SockJS('/ws/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, onConnected, onError);
    }

    function onConnected() {
        console.log("Conectado ao WebSocket de chat!");
        chatMessagesElement.innerHTML = '';

        stompClient.subscribe('/topic/public', onMessageReceived);
    }

    function onError(error) {
        console.error('Erro na conexão WebSocket:', error);
        chatMessagesElement.innerHTML = '<li>Erro de conexão. Tentando reconectar...</li>';
        setTimeout(connectChat, 5000);
    }

    function sendMessage() {
        const sender = chatSender.value.trim();
        const content = chatInput.value.trim();

        if (!stompClient || !stompClient.connected) {
            alert("Chat não conectado. Tente recarregar a página.");
            return;
        }

        if (content && sender) {
            const chatMessage = {
                sender: sender,
                content: content
            };

            stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
            chatInput.value = ''; // Limpa o input
        }
    }

    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);

        const listItem = document.createElement('li');

        listItem.innerHTML = `
            <span style="color: #ccc;">[${message.timestamp || '??:??'}]</span>
            <strong style="color: #f39c12;">${message.sender}:</strong>
            ${message.content}
        `;

        chatMessagesElement.appendChild(listItem);
        chatMessagesElement.scrollTop = chatMessagesElement.scrollHeight;
    }

    function onPlayerReady(event) {
        event.target.playVideo();
        connectToMetadataStream();
        renderPlaylist();
        connectChat();
        syncChatHeight();
        setTimeout(syncChatHeight, 500);
        setTimeout(syncChatHeight, 1500);
    }

    function syncChatHeight() {
            // 🛑 Referência: Apenas o Card da Rádio (.radio-container) 🛑
        const radioCard = document.querySelector('.radio-container');
        const chatCard = document.querySelector('.chat-container');

        if (radioCard && chatCard) {
            // 1. Define a altura total do Card do Chat (Igual ao Card da Rádio)
            const radioHeight = radioCard.getBoundingClientRect().height;

            chatCard.style.height = `${radioHeight - 1}px`; // Sincroniza a altura externa com o valor decimal

            // --- Variáveis para Cálculo Interno ---
            const chatMessagesUl = document.getElementById('chat-messages');
            const chatHeader = chatCard.querySelector('h3');
            const chatForm = document.getElementById('chat-form');

            // Função auxiliar para pegar a altura com margens (externa)
            // **NOTA:** Esta função AINDA DEVE USAR getBoundingClientRect().height
            const getTotalHeight = (element) => {
                if (!element) return 0;
                const rect = element.getBoundingClientRect();
                const style = window.getComputedStyle(element);

                // Altura decimal real. Adiciona as margens externas.
                const margin = parseFloat(style.marginTop) + parseFloat(style.marginBottom);
                return rect.height + margin;
            };

            // 2. Calcula a altura total de todos os elementos FIXOS DENTRO do Chat
            const headerTotalHeight = getTotalHeight(chatHeader);
            const formTotalHeight = getTotalHeight(chatForm);

            // 3. Subtrai o padding interno do chatCard (o container principal)
            const chatCardStyle = window.getComputedStyle(chatCard);
            const chatPaddingVertical = parseFloat(chatCardStyle.paddingTop) + parseFloat(chatCardStyle.paddingBottom);

            // 4. Altura Disponível para a Lista de Mensagens (UL)
            const availableHeightForMessages = radioHeight -
                                                chatPaddingVertical -
                                                headerTotalHeight -
                                                formTotalHeight;

            // 5. Aplica a altura calculada (garante que a rolagem funcione)
            if (availableHeightForMessages > 50) {
                // Aplica a altura interna com o valor decimal
                chatMessagesUl.style.height = `${availableHeightForMessages}px`;
                chatMessagesUl.style.flexGrow = '0';
            } else {
                 chatMessagesUl.style.flexGrow = '1';
                 chatMessagesUl.style.height = 'auto';
            }
        }
    }

</script>
