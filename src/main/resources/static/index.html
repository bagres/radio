<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Rádio Bagres — Entrar na Sala</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b1d33;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1f1f1;
            font-family: "Poppins", sans-serif;
        }

        .card-simple {
            background: #0f263f;
            border-radius: 14px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .title-gradient {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3498db, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>

<div class="card-simple">
    <div class="text-center mb-3">
        <div class="title-gradient">Rádio Bagres 🐟</div>
    </div>

    <form id="roomForm">
        <input id="roomInput" class="form-control mb-3"
               placeholder="Digite o nome da sala" required>

        <button class="btn btn-success btn-lg w-100 fw-bold" type="submit">
            Entrar
        </button>
    </form>
</div>

<script>
    document.getElementById("roomForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const room = document.getElementById("roomInput").value.trim();
        window.location.href = `/radio/${room}`;
    });
</script>

</body>
</html>
