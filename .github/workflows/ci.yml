name: CI - Build, Teste e Push para GHCR

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar e rodar testes (CI - Qualidade)
        run: mvn clean verify -DskipTests=false

      - name: Build da imagem Docker
        run: docker build -t radio .

      - name: Testar execução local do container
        run: |
          docker run -d -p 8080:8080 --name radio radio
          sleep 10
          docker ps
          docker logs radio || true
          docker stop radio || true
          docker rm radio || true

      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar e enviar imagem Docker para o GHCR
        run: |
          IMAGE_REPO=ghcr.io/${{ github.repository }}

          # Tags (use apenas uma barra!)
          docker tag radio:latest $IMAGE_REPO:latest
          docker tag radio:latest $IMAGE_REPO:${{ github.sha }}

          # Push
          docker push $IMAGE_REPO:latest
          docker push $IMAGE_REPO:${{ github.sha }}
