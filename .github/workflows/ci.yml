name: CI/CD Multi-Ambiente

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Test
        run: mvn clean verify -DskipTests=false

      - name: Docker build image
        run: |
          docker build -t app-image:ci .

      - name: Save image to tar
        run: |
          docker save app-image:ci -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: image.tar

  deploy:
    name: Deploy (master / develop)
    needs: build
    runs-on: ubuntu-latest
    # só executa deploy caso seja master ou develop
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-tar
          path: .

      - name: Load docker image
        run: |
          docker load -i image.tar

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push to GHCR (DEV / PROD)
        env:
          REPO_BASE: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          BRANCH="${GITHUB_REF##*/}"

          if [[ "$BRANCH" == "master" ]]; then
            IMAGE="ghcr.io/${REPO_BASE}-prod"
            LOCAL_IMAGE="app-image:ci"
          elif [[ "$BRANCH" == "develop" ]]; then
            IMAGE="ghcr.io/${REPO_BASE}-dev"
            LOCAL_IMAGE="app-image:ci"
          else
            echo "Branch não suportada para deploy: $BRANCH"
            exit 0
          fi

          docker tag "${LOCAL_IMAGE}" "${IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${IMAGE}:${SHA}"

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA}"

      - name: Notify Render
        run: |
          BRANCH="${GITHUB_REF##*/}"

          if [[ "$BRANCH" == "master" ]]; then
            echo "Disparando deploy de PRODUÇÃO..."
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          fi

          if [[ "$BRANCH" == "develop" ]]; then
            echo "Disparando deploy de DESENVOLVIMENTO..."
            curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
          fi
