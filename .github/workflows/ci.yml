name: CI/CD Multi-Ambiente

on:
  push:
    branches: [ develop, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Test
        run: mvn clean verify -DskipTests=false

      - name: Docker Build
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            IMAGE_NAME="radio-prod"
          else
            IMAGE_NAME="radio-dev"
          fi

          docker build -t $IMAGE_NAME .

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (DEV/PROD)
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            IMAGE="ghcr.io/${{ github.repository }}-prod"
            LOCAL_IMAGE="radio-prod"
          else
            IMAGE="ghcr.io/${{ github.repository }}-dev"
            LOCAL_IMAGE="radio-dev"
          fi

          echo "Publicando imagem: $IMAGE"

          docker tag $LOCAL_IMAGE $IMAGE:latest
          docker tag $LOCAL_IMAGE $IMAGE:${{ github.sha }}

          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Notify Render
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
          fi

