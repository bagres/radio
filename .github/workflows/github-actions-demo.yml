name: CI/CD Multi-Ambiente

on:
  push:
    branches: [ develop, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug Secrets (não imprime o valor, só verifica se existe)
        run: |
          echo "PROD hook vazio?  $([[ -z '${{ secrets.RENDER_PROD_DEPLOY_HOOK }}' ]] && echo SIM || echo NÃO)"
          echo "DEV hook vazio?   $([[ -z '${{ secrets.RENDER_DEV_DEPLOY_HOOK }}' ]] && echo SIM || echo NÃO)"

      - name: Notify Render
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
          fi
